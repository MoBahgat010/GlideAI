services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag-triton:latest
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all # makes all GPUs visible to the container and so can use nvidia-smi
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Prometheus
    volumes:
      - ./models:/models:ro # makes the models directory read-only inside the container
      - ./scripts:/app/scripts:ro
      - ./config.py:/app/config.py:ro
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ../../.venv:/app/.venv:ro
    command: sh -c "python3 scripts/download_models.py && tritonserver --model-repository=/models --log-verbose=1 --allow-http=true --allow-grpc=true --allow-metrics=true --strict-model-config=false --rate-limit=execution_count --rate-limit-resource=GPU_MEMORY:${VRAM_QUOTA:-}:0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s